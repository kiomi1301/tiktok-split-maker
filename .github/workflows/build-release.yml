name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"

      - name: Prepare pinned FFmpeg
        shell: powershell
        run: ./prepare_ffmpeg.ps1

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run checks
        shell: cmd
        run: |
          python -m py_compile main.py engine.py i18n.py version.py test_core.py test_i18n.py test_render_integration.py test_release_layout.py
          python test_core.py
          python test_i18n.py
          python test_render_integration.py
          python test_release_layout.py

      - name: Build autonomous EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile --noupx
          --name "TikTok Split Maker"
          --icon "assets\icon.ico"
          --version-file "version_info.txt"
          --add-data "assets;assets"
          --add-data "LICENSE;."
          --add-data "THIRD_PARTY_NOTICES.md;."
          --add-binary "vendor\ffmpeg\bin\ffmpeg.exe;ffmpeg\bin"
          --add-binary "vendor\ffmpeg\bin\ffprobe.exe;ffmpeg\bin"
          --additional-hooks-dir "."
          main.py

      - name: Create checksums and FFmpeg source package
        shell: powershell
        run: |
          $exe = "dist\TikTok Split Maker.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  TikTok Split Maker.exe" | Set-Content -Encoding ascii "dist\TikTok Split Maker.exe.sha256"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/FFmpeg/FFmpeg/archive/946fcce07b6dcd0331c8cc609192aeff5e1924f8.zip" `
            -OutFile "dist\FFmpeg-9.0.2-source.zip"
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\THIRD_PARTY_NOTICES.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Split-Maker-Windows
          path: |
            dist/TikTok Split Maker.exe
            dist/TikTok Split Maker.exe.sha256
            dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist\TikTok Split Maker.exe" `
            "dist\TikTok Split Maker.exe.sha256" `
            "dist\FFmpeg-9.0.2-source.zip" `
            "dist\THIRD_PARTY_NOTICES.md" `
            "dist\LICENSE.txt" `
            --title "TikTok Split Maker $env:GITHUB_REF_NAME" `
            --generate-notes
